<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Суббота</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        h1 { margin-bottom: 25px; font-size: 24px; color: #333; }
        .btn-box { display: flex; justify-content: center; gap: 20px; height: 50px; }
        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        #yesBtn { background: #4CAF50; color: white; }
        #noBtn { background: #f44336; color: white; }
        #resultImg { width: 100%; margin-top: 20px; display: none; border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1 id="qText">Кто бухать в субботу?</h1>
    <div class="btn-box" id="btns">
        <button id="yesBtn">Я</button>
        <button id="noBtn">Не я</button>
    </div>
    <img id="resultImg" src="image_0.png" alt="Результат">
</div>

<script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const img = document.getElementById('resultImg');
    const btns = document.getElementById('btns');
    const qText = document.getElementById('qText');

    function move() {
        noBtn.style.position = 'fixed';
        const x = Math.random() * (window.innerWidth - 80);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
    }

    noBtn.addEventListener('mouseover', move);
    noBtn.addEventListener('touchstart', move);

    yesBtn.addEventListener('click', () => {
        btns.style.display = 'none';
        qText.innerText = "Правильный выбор!";
        img.style.display = 'block';
    });
</script>

</body>
</html>
